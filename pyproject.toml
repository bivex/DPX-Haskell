[project]
name = "dpx-haskell"
version = "0.1.0"
description = "Static Architecture, Typeclass Idiom, Monad Transformer & Safety Analyzer for Haskell (GHC 9.2 - 9.10+ / Haskell2021)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
dpx-haskell = "pattern_detector.adapters.inbound.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
